spring:
  application:
    name: ms-internal-users-management
  flyway:
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  profiles:
    active: ${ACTIVE_PROFILE}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

rabbitmq:
  exchange:
    notification: woridge.exchange
  routing:
    user-created: user.created
    resignation-created: resignation.created

server:
  port: 8081
  servlet:
    context-path: /api/internal-users

internal:
  secret-key: ${INTERNAL_SECRET_KEY}

services:
  auth-url: ${AUTH_SERVICE_URL}