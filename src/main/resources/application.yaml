spring:
  application:
    name: ms-internal-users-management
  flyway:
    validate-on-migrate: true
  security:
    jwt:
      secret-key: ${SECRET_KEY}
  jpa:
    hibernate:
      ddl-auto: validate
  profiles:
    active: ${ACTIVE_PROFILE}
  rabbitmq:
    host: ${RABBIT_HOST}
    port: 5672
    username: ${RABBIT_USERNAME}
    password: ${RABBIT_PASSWORD}

rabbitmq:
  exchange:
    notification: notification.exchange

  routing:
    user-created: notification.user.created

  #  RabbitMQ
  rabbitmq:
    host: ${MQ_HOST}
    port: ${MQ_PORT}
    username: ${MQ_USER}
    password: ${MQ_PASS}

server:
  port: 8081
  servlet:
    context-path: /api/internal-users