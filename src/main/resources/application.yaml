spring:
  application:
    name: ms-internal-users-management
  flyway:
    validate-on-migrate: true
  security:
    jwt:
      secret-key: ${SECRET_KEY}
  jpa:
    hibernate:
      ddl-auto: validate
  profiles:
    active: ${ACTIVE_PROFILE}

server:
  port: 8081
  servlet:
    context-path: /api/internal-users