spring:
  application:
    name: ms-internal-users-management
  flyway:
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

rabbitmq:
  exchange:
    notification: notification.exchange
    chatbot-resignation: woridge.resignation.exchange
    chatbot-salary: woridge.salary.exchange
  routing:
    user-created: notification.user.created   #  email
    user-sync: user.created                  #  attendance
    resignation-created: resignation.created
    holiday-created: holiday.created
    user-created-interview: user.created.interview
    chatbot-sync: user.chatbot.sync
    chatbot-resignation: chatbot.resignation.created
    chatbot-salary: chatbot.salary.verse
    user-created-document: user.created.document #ms-document
    tenant-ready: tenant.ready.ms-user
  queue:
    provisioning: q.user.provisioning


server:
  port: 8081
  servlet:
    context-path: /api/internal-users

internal:
  secret-key: ${INTERNAL_SECRET_KEY}

services:
  auth-url: ${AUTH_SERVICE_URL}


tenant:
  database:
    host: woridge.db.userinternal
    port: ${POSTGRES_PORT}
    username: ${POSTGRES_USER}
    password: ${DB_PASSWORD}

logging:
  level:
    root: INFO
    org.woridge: INFO
  logback:
    rollingpolicy:
      max-history: 3
      max-file-size: 10MB