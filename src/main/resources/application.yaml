spring:
  application:
    name: ms-internal-users-management
  flyway:
    validate-on-migrate: true
  security:
    jwt:
      secret-key: ${SECRET_KEY}
  jpa:
    hibernate:
      ddl-auto: validate
  profiles:
    active: ${ACTIVE_PROFILE}
  rabbitmq:
    host: ${MQ_HOST}
    port: ${MQ_PORT}
    username: ${MQ_USER}
    password: ${MQ_PASS}

rabbitmq:
  exchange:
    notification: woridge.exchange
  routing:
    user-created: user.created
    resignation-created: resignation.created

server:
  port: 8081
  servlet:
    context-path: /api/internal-users